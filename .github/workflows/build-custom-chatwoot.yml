name: Build Custom Chatwoot

on:
  workflow_dispatch:
  push:
    branches:
      - whatsapp-global-queue-v4.17.1

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Chatwoot
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/h453g4w4/chatwoot:whatsapp-v4.17.1
            ghcr.io/h453g4w4/chatwoot:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
